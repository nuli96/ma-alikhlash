<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5a34"/>
      <stop offset="100%" stop-color="#167a47"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bgGrad1)"/>
  <circle cx="500" cy="80" r="160" fill="rgba(255,255,255,0.06)"/>
  <circle cx="100" cy="300" r="140" fill="rgba(255,255,255,0.04)"/>
  
  <!-- Banner Label -->
  <rect x="40" y="35" width="220" height="30" rx="6" fill="#c89524"/>
  <text x="50" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" letter-spacing="1">DOKUMENTASI KURIKULUM</text>
  
  <!-- Content Graphic -->
  <g transform="translate(60, 100)">
    <!-- Meja Rapat / Forum Diskusi Guru -->
    <rect x="0" y="140" width="480" height="15" rx="4" fill="#ffffff" opacity="0.9"/>
    
    <!-- Proyektor / Layar Materi -->
    <rect x="140" y="0" width="200" height="110" rx="8" fill="#ffffff" stroke="#c89524" stroke-width="3"/>
    <rect x="155" y="15" width="170" height="12" rx="3" fill="#0f5a34"/>
    <rect x="155" y="35" width="120" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="155" y="47" width="140" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="155" y="59" width="100" height="6" rx="2" fill="#cbd5e1"/>
    
    <!-- Diagram batang kecil di layar -->
    <rect x="240" y="75" width="14" height="25" fill="#167a47"/>
    <rect x="260" y="68" width="14" height="32" fill="#c89524"/>
    <rect x="280" y="60" width="14" height="40" fill="#0f5a34"/>
    
    <!-- Guru / Peserta Rapat (Siluet Rapi) -->
    <circle cx="80" cy="90" r="18" fill="#ffffff" opacity="0.85"/>
    <path d="M 50,140 C 50,115 110,115 110,140 Z" fill="#ffffff" opacity="0.85"/>

    <circle cx="400" cy="90" r="18" fill="#ffffff" opacity="0.85"/>
    <path d="M 370,140 C 370,115 430,115 430,140 Z" fill="#ffffff" opacity="0.85"/>
  </g>
  
  <text x="40" y="315" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20">Supervisi Akademik &amp; KMA 450</text>
  <text x="40" y="342" fill="#d1fae5" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Peningkatan Mutu Perangkat Ajar &amp; Modul Ajar Berbasis Kurikulum Merdeka</text>
</svg>
